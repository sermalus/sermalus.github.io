<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Portfolio.pdf</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='3' fill='%23FC413D'/%3E%3Ctext x='12' y='15.5' text-anchor='middle' fill='%23ffffff' font-family='Arial,sans-serif' font-weight='700' font-size='8'%3EPDF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="viewer-header" id="viewerHeader">
      <a class="icon-btn back-home-btn" href="../" title="Back to home" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>
      <div class="file-badge" aria-hidden="true">
        <svg viewBox="3 3 18 18" width="24" height="24" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="3" fill="#FC413D"></rect>
          <path fill="#ffffff" d="M6.4 14.3V9.7h1.75c.54 0 .96.13 1.25.4.3.26.44.64.44 1.12 0 .48-.15.86-.45 1.13-.3.27-.72.4-1.26.4H7.45v1.55H6.4Zm1.05-2.42h.64c.24 0 .42-.05.54-.17.12-.11.18-.27.18-.48 0-.21-.06-.37-.18-.49-.12-.11-.3-.17-.54-.17h-.64v1.31Zm3.18 2.42V9.7h1.52c.72 0 1.27.2 1.67.6.4.4.6.97.6 1.7s-.2 1.3-.6 1.7c-.4.4-.95.6-1.67.6h-1.52Zm1.05-.9h.45c.41 0 .72-.12.93-.35.21-.23.32-.58.32-1.05s-.11-.82-.32-1.05c-.21-.23-.52-.35-.93-.35h-.45v2.8Zm3.44.9V9.7h2.85v.89h-1.8v1.02h1.57v.88h-1.57v1.81h-1.05Z"></path>
        </svg>
      </div>
      <h1 class="file-title">Portfolio.pdf</h1>
    </header>

    <div class="toolbar-row">
      <div class="toolbar-pill" role="toolbar" aria-label="PDF viewer controls">
        <div class="page-nav">
          <span class="page-label">Page</span>
          <input
            id="pageInput"
            class="page-input"
            type="text"
            inputmode="numeric"
            value="1"
            aria-label="Page number"
          >
          <span class="page-total" id="pageTotal">of 68</span>
        </div>

        <div class="toolbar-divider" aria-hidden="true"></div>

        <div class="toolbar-actions">
          <button
            id="downloadBtn"
            class="icon-btn"
            type="button"
            title="Download"
            aria-label="Download Portfolio.pdf"
          >
            <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
            </svg>
          </button>

          <button
            id="fullscreenBtn"
            class="icon-btn"
            type="button"
            title="Fullscreen"
            aria-label="Toggle fullscreen"
            aria-pressed="false"
          >
            <svg class="icon-enter-fs" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z"/>
            </svg>
            <svg class="icon-exit-fs" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M240-120v-120H120v-80h200v200h-80Zm400 0v-200h200v80H720v120h-80ZM120-640v-80h120v-120h80v200H120Zm520 0v-200h80v120h120v80H640Z"/>
            </svg>
          </button>
        </div>

        <div class="toolbar-divider" aria-hidden="true"></div>

        <div class="zoom-controls">
          <button
            id="zoomOutBtn"
            class="icon-btn"
            type="button"
            title="Zoom out"
            aria-label="Zoom out"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M5 13v-2h14v2H5z"/>
            </svg>
          </button>

          <button
            id="zoomPresetBtn"
            class="zoom-preset-btn"
            type="button"
            popovertarget="zoomMenu"
            title="Zoom options"
            aria-label="Zoom options"
          >
            <span id="zoomValueLabel">100 %</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M7 10l5 5 5-5H7z"/>
            </svg>
          </button>

          <button
            id="zoomInBtn"
            class="icon-btn"
            type="button"
            title="Zoom in"
            aria-label="Zoom in"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="collapse-pill">
        <button
          id="headerToggleBtn"
          class="icon-btn icon-btn--lg"
          type="button"
          title="Hide top bar"
          aria-label="Toggle top bar"
          aria-pressed="false"
        >
          <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="zoomMenu" class="zoom-menu" popover="auto">
      <button type="button" class="zoom-option" data-zoom="fit-width">Fit to width</button>
      <button type="button" class="zoom-option" data-zoom="fit-page">Fit to page</button>
      <div class="zoom-menu-sep" aria-hidden="true"></div>
      <button type="button" class="zoom-option" data-zoom="0.5">50%</button>
      <button type="button" class="zoom-option" data-zoom="0.75">75%</button>
      <button type="button" class="zoom-option is-selected" data-zoom="1">100%</button>
      <button type="button" class="zoom-option" data-zoom="1.25">125%</button>
      <button type="button" class="zoom-option" data-zoom="1.5">150%</button>
      <button type="button" class="zoom-option" data-zoom="2">200%</button>
    </div>

    <div class="workspace">
      <aside class="viewer-sidebar" id="sidebar" aria-label="Page navigation">
        <div class="icon-rail">
          <button
            id="thumbnailsToggleBtn"
            class="rail-btn is-active"
            type="button"
            title="Page thumbnails"
            aria-label="Toggle page thumbnails"
            aria-pressed="true"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
            </svg>
          </button>

          <button
            id="sidebarCollapseBtn"
            class="rail-btn"
            type="button"
            title="Hide side panel"
            aria-label="Hide side panel"
            aria-pressed="false"
          >
            <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm200-80v-480H160v480h200Zm80 0h360v-480H440v480Zm200-120L520-480l120-120v240Z"/>
            </svg>
          </button>
        </div>

        <div class="thumbnails-pane" id="thumbnailsPane">
          <div class="thumbnails-list" id="thumbnailsList" role="listbox" aria-label="Thumbnails"></div>
        </div>
      </aside>

      <main class="reader-scroll" id="readerScroll" tabindex="0" aria-label="PDF document">
        <div class="reader-status" id="readerStatus" role="status" aria-live="polite">
          Loading Portfolio.pdf…
        </div>
        <div class="document-column" id="documentColumn"></div>
      </main>
    </div>
  </div>

  <dialog id="photoLightbox" class="photo-lightbox" closedby="any" aria-label="Enlarged image preview">
    <form method="dialog" class="lightbox-bar">
      <button type="submit" class="lightbox-close" aria-label="Close image preview" autofocus>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </form>
    <div class="lightbox-stage">
      <canvas id="lightboxCanvas" class="lightbox-canvas"></canvas>
    </div>
  </dialog>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
